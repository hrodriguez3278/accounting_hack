# Ejecución de producción de NEXORA AI contra el Supabase configurado en .env.
#   docker compose up -d --build
# Todo se publica por un solo puerto (80): la web y, en /api, la API.
# Acceso: http://<IP-del-servidor>  (o el dominio, cuando exista)
services:
  api:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      SEED_DEMO: ${SEED_DEMO:-true}
    expose: ["4000"]          # solo accesible desde la web (red interna de Docker)
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        NUXT_PUBLIC_SUPABASE_URL: ${NUXT_PUBLIC_SUPABASE_URL}
        NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-}   # vacío = misma dirección que la web
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    ports: ["${WEB_PORT:-80}:80"]
    depends_on: [api]
    restart: unless-stopped
